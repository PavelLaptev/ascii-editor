<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
    />
    <meta name="description" content="ASKI — an ASCII graphics tool. Draw with characters: layers, brushes, shapes, and plain-text export, all in the browser." />
    <title>ASKI — ASCII graphics tool</title>

    <!-- Link previews. Crawlers want an absolute image URL, so the deploy sets VITE_SITE_URL
         (see .env); until then the path is relative, which the lenient crawlers still resolve. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ASKI" />
    <meta property="og:title" content="ASKI — ASCII graphics tool" />
    <meta property="og:description" content="Draw with characters: layers, brushes, shapes, and plain-text export, all in the browser." />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The ASKI wordmark in cyan block letters over a dark grid, captioned ASCII art editor" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ASKI — ASCII graphics tool" />
    <meta name="twitter:description" content="Draw with characters: layers, brushes, shapes, and plain-text export, all in the browser." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
